# Enables AndroidX packaging for modern Jetpack libraries
android.useAndroidX=true

# Automatically migrates older third-party libraries to AndroidX
android.enableJetifier=true

# Optimizations for faster Gradle builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
