# Enables AndroidX packaging
android.useAndroidX=true
# android.enableJetifier=true   <-- REMOVED: deprecated in AGP 8, costs build time + memory.
#                                   Re-enable only if a non-AndroidX dependency forces it.

# Tuned for CircleCI `large` (4 vCPU / 8 GB).
# 4 GB heap + 1 GB metaspace leaves ~3 GB headroom for native/OS/agent.
# HeapDumpOnOOM lets you prove JVM-OOM vs system-OOM from the artifact if it ever recurs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=true

# Run Kotlin compiler inside the daemon instead of forking a 2nd JVM (~500 MB saved)
kotlin.compiler.execution.strategy=in-process
