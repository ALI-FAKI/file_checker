version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large          # was: medium (4 GB → 8 GB). THIS is the fix.

jobs:
  build-and-test:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Auto-Bootstrap Gradle Wrapper
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.4
            fi
            chmod +x gradlew

      - restore_cache:
          keys:
            - android-cache-v10-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - android-cache-v10-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}

      - run:
          name: Build Debug APK
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            ./gradlew assembleDebug --stacktrace

      - save_cache:
          key: android-cache-v10-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: debug-apk

workflows:
  version: 2.1
  build-workflow:
    jobs:
      - build-and-test
