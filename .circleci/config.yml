version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: medium

jobs:
  build-and-test:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Auto-Bootstrap Gradle Wrapper & Clean Caches
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.4
            fi
            chmod +x gradlew
            rm -rf /home/circleci/.gradle/caches/transforms-4/
            rm -rf /home/circleci/.gradle/caches/journal-1/

      - restore_cache:
          key: android-cache-v9-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}

      - run:
          name: Build Debug APK
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            ./gradlew clean assembleDebug --no-daemon

      - save_cache:
          key: android-cache-v9-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: debug-apk

workflows:
  version: 2.1
  build-workflow:
    jobs:
      - build-and-test
