version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: medium

jobs:
  build-and-test:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Setup Gradle Wrapper
          command: |
            if [ ! -f "gradlew" ]; then
              echo "Generating Gradle wrapper..."
              gradle wrapper
            fi
            chmod +x gradlew

      - restore_cache:
          key: android-cache-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}

      - run:
          name: Download Dependencies
          command: ./gradlew dependencies

      - save_cache:
          key: android-cache-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: debug-apk

workflows:
  version: 2.1
  build-workflow:
    jobs:
      - build-and-test
