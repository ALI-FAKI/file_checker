version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: medium

jobs:
  build-and-test:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Setup Environment & Gradle Wrapper
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            if [ ! -f "gradlew" ]; then
              gradle wrapper
            fi
            chmod +x gradlew
            # Clean corrupt cache states
            rm -rf /home/circleci/.gradle/caches/transforms-4/
            rm -rf /home/circleci/.gradle/caches/journal-1/

      - restore_cache:
          key: android-cache-v5-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}

      - run:
          name: Resolve Android Dependencies and Tools
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            ./gradlew androidDependencies

      - save_cache:
          key: android-cache-v5-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Build Debug APK
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            ./gradlew assembleDebug

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: debug-apk

workflows:
  version: 2.1
  build-workflow:
    jobs:
      - build-and-test
