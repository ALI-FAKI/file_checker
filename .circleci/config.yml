version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: medium

jobs:
  build-and-test:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Setup Environment & Permissions
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            chmod +x gradlew
            # Completely wipe old corrupted Gradle caches & wrappers
            rm -rf /home/circleci/.gradle/caches/
            rm -rf /home/circleci/.gradle/wrapper/

      - restore_cache:
          key: android-cache-v6-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

      - run:
          name: Build Debug APK
          command: |
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            ./gradlew clean assembleDebug --no-daemon

      - save_cache:
          key: android-cache-v6-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: debug-apk

workflows:
  version: 2.1
  build-workflow:
    jobs:
      - build-and-test
