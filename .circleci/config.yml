version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-and-test:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Auto-Bootstrap Gradle Wrapper
          command: |
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.4 --no-daemon
            fi
            chmod +x gradlew

      - restore_cache:
          keys:
            - android-cache-v11-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - android-cache-v11-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}

      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug --no-daemon --stacktrace

      - run:
          name: Remove Gradle Lock Files Before Caching
          command: find ~/.gradle/caches -name "*.lock" -type f -delete || true

      - save_cache:
          key: android-cache-v11-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: debug-apk

workflows:
  version: 2.1
  build-workflow:
    jobs:
      - build-and-test
